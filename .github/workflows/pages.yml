name: Deploy the web wallet to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployed.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Settle the artifact listing
        # The list-artifacts API has returned an empty set seconds after a
        # successful upload; a short pause avoids that window.
        run: sleep 5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy (retry 1)
        id: deployment_r1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Cool down before the last deploy attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment_r1.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry 2)
        id: deployment_r2
        if: steps.deployment.outcome == 'failure' && steps.deployment_r1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Resolve the deployed URL
        id: deployed
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          [ -n "$url" ] || url="${{ steps.deployment_r1.outputs.page_url }}"
          [ -n "$url" ] || url="${{ steps.deployment_r2.outputs.page_url }}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
