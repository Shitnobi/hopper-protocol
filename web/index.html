<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18241a">
<title>HOPPER — the pond on Bitcoin</title>
<meta name="description" content="Non-custodial HOPPER v7 wallet and game: Hopper are satoshis, their state lives on Bitcoin.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https: ws: wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app" aria-live="polite"></div>
<div id="intro" class="intro" hidden><canvas></canvas></div>
<div id="overlay" class="overlay" hidden></div>
<div id="drawer-backdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" aria-label="menu"></aside>
<nav id="tabbar" class="tabbar" hidden></nav>
<div id="toasts" class="toasts"></div>
<div id="busy" class="busy" hidden>
  <div class="box" data-lily="accent">
    <img class="frog" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" id="busy-frog">
    <div id="busy-text" class="small muted">working…</div>
  </div>
</div>
<script src="js/build-guard.js"></script>
<script>
// A blank green page is the worst possible failure: the shell (and its CSS)
// loaded, but the module graph did not start. If #app is still empty
// shortly after load, or the module script itself fails, say so and offer a
// one-tap repair — build-guard revalidates the cached shell and reloads.
(() => {
  'use strict';
  if (!/^https?:$/.test(location.protocol)) return;
  let shown = false;
  const app = document.getElementById('app');
  const show = (why) => {
    if (shown || !app || app.childElementCount) return;
    const busy = document.getElementById('busy');
    if (busy && !busy.hidden) return;
    shown = true;
    app.innerHTML = `
      <div class="onboard"><div class="stage" style="text-align:center">
        <div class="logo"><div class="word">HOPPER</div><div class="tag">THE POND ON BITCOIN</div></div>
        <p class="sub">The app did not start${why ? ` — ${why}` : ''}.</p>
        <p class="hint">This is usually an old cached copy of the wallet from the
          previous version. Reloading refreshes the shell; your words and frogs
          stay exactly where they are.</p>
        <button class="btn accent block" id="boot-repair" data-edge="accent">RELOAD THE APP</button>
      </div></div>`;
    document.getElementById('boot-repair').addEventListener('click', () => {
      if (globalThis.HOPPER_REPAIR) globalThis.HOPPER_REPAIR();
      else location.reload();
    });
  };
  window.addEventListener('error', (ev) => {
    if (ev.target && ev.target.tagName === 'SCRIPT') show('a script failed to load');
  }, true);
  setTimeout(() => show(''), 5000);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
